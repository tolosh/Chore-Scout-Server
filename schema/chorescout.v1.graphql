# Chore Scout server GraphQL contract, version 1 (CS-3941).
#
# Source: Server and DSL Integration Specification, Confluence 3220570116 §6 (v7).
# Exposed to the apps only through the DSL (ID-1, CS-3935). No subscriptions:
# clients poll changes(since) (D14).
#
# Naming: every type is prefixed "Cs" so it never collides with the DSL's
# existing types (Money, Node, Account and the rest; see test/schema.test.ts).
# Root fields do not reuse the DSL's root field names.
#
# Versioning: once merged, this file only changes compatibly. A breaking change
# needs a new file, schema/chorescout.v2.graphql. CI enforces this
# (scripts/schema-compat.ts).
#
# Errors are GraphQL errors with extensions.code set to a CsErrorCode value.
# BOB declines are results (e.g. CsPurchaseResult.outcome), not errors.
#
# Ownership reminders: the server holds BOB customer numbers only, never
# contact details, card numbers or charity payment routing, and makes no money
# decision (amounts, limits, balances come from BOB).

schema {
  query: Query
  mutation: Mutation
}

"ISO-8601 timestamp with offset."
scalar CsDateTime

"ISO-8601 calendar date (YYYY-MM-DD)."
scalar CsDate

"Error codes carried in GraphQL error extensions.code (spec §6)."
enum CsErrorCode {
  UNAUTHENTICATED
  FORBIDDEN
  STALE_VERSION
  INVALID
  INSUFFICIENT_FUNDS
  NOT_ALLOWED_IN_STATE
  CHARITY_UNAVAILABLE
  UPSTREAM_UNAVAILABLE
}

"A money amount as a decimal string, as BOB and the DSL Money type carry it."
type CsMoney {
  amount: String!
  currency: String!
}

input CsMoneyInput {
  amount: String!
  currency: String!
}

enum CsJar {
  SPEND
  SAVE
  GIVE
}

# ---------------------------------------------------------------- viewer

enum CsRole {
  GUARDIAN
  CHILD
  TELLER
}

"Age band worked out by BOB from the date of birth (ID-9)."
enum CsAgeBand {
  CHILD
  YOUTH
  ADULT
}

"""
The signed-in person, derived only from BOB's session check (spec §3).
Nothing here is taken from client input.
"""
type CsViewer {
  customerId: ID!
  role: CsRole!
  tenantId: ID!
  ageBand: CsAgeBand
  linkedChildIds: [ID!]!
  linkedGuardianIds: [ID!]!
  anonymousPlayerId: ID
}

# ---------------------------------------------------------------- family and set-up

"A pointer record only; BOB's Guardian-child links are authoritative."
type CsFamily {
  familyId: ID!
  tenantId: ID!
  guardianCustomerIds: [ID!]!
  childCustomerIds: [ID!]!
}

type CsChild {
  customerId: ID!
  familyId: ID!
  ageBand: CsAgeBand
}

enum CsFamilySetupState {
  IN_PROGRESS
  PARTIAL
  COMPLETE
}

enum CsSetupSlotState {
  PENDING
  CREATED
  REFUSED
}

type CsSetupSlot {
  slot: Int!
  state: CsSetupSlotState!
  childCustomerId: ID
  "Per-slot reason when REFUSED, e.g. email already used in this bank (ID-12)."
  reason: String
}

type CsFamilySetup {
  setupRef: ID!
  state: CsFamilySetupState!
  slots: [CsSetupSlot!]!
  familyId: ID
}

"Passed to BOB's create-linked-child under the Guardian's session. The server does not store contact details."
input CsSetupChildInput {
  firstName: String!
  dateOfBirth: CsDate!
  email: String!
}

# ---------------------------------------------------------------- allowance (revised SD-2, SD-7)

enum CsAllowanceMode {
  FREE
  LINKED
  EARNED
}

enum CsCadence {
  WEEKLY
}

type CsSplit {
  spendPercent: Int!
  savePercent: Int!
  givePercent: Int!
}

input CsSplitInput {
  spendPercent: Int!
  savePercent: Int!
  givePercent: Int!
}

"The Linked-mode chore condition, checked by the server at the cycle cut-off."
enum CsLinkedCondition {
  WEEK_CHORES_DONE
}

type CsAllowanceRule {
  childCustomerId: ID!
  mode: CsAllowanceMode!
  "Always equals the Guardian's standing authority amount in BOB (SD-7)."
  amount: CsMoney!
  cadence: CsCadence!
  startDate: CsDate!
  timezone: String!
  defaultSplit: CsSplit!
  linkedCondition: CsLinkedCondition
  version: Int!
}

enum CsCycleDecision {
  PAY
  SKIP
}

enum CsCycleStatus {
  DECIDED
  EXECUTED
  FAILED
}

type CsSplitLeg {
  jar: CsJar!
  amount: CsMoney!
}

type CsAllowanceReceipt {
  bobOperationRef: ID!
  amount: CsMoney!
  legs: [CsSplitLeg!]!
}

type CsAllowanceCycle {
  cycleKey: ID!
  periodStart: CsDate!
  decision: CsCycleDecision!
  reason: String
  ruleVersion: Int!
  amount: CsMoney
  bobOperationRef: ID
  status: CsCycleStatus!
  receipt: CsAllowanceReceipt
}

type CsAllowance {
  rule: CsAllowanceRule
  nextDueDate: CsDate
  lastCycle: CsAllowanceCycle
}

# ---------------------------------------------------------------- jobs and approvals

enum CsJobKind {
  HOME_JOB
  EXTRA_EARNER
  GOOD_DEED
  NEIGHBOURHOOD
}

enum CsJobStatus {
  OPEN
  SUBMITTED
  APPROVED
  REJECTED
}

type CsJob {
  jobId: ID!
  childCustomerId: ID!
  kind: CsJobKind!
  title: String!
  reward: CsMoney
  status: CsJobStatus!
  "Reference to the child's evidence photo, if any."
  evidenceRef: String
  version: Int!
}

enum CsApprovalKind {
  JOB
  UNLOCK
}

enum CsApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}

type CsApproval {
  approvalId: ID!
  kind: CsApprovalKind!
  status: CsApprovalStatus!
  childCustomerId: ID!
  "jobId for JOB approvals, grantId for UNLOCK approvals."
  subjectId: ID!
  createdAt: CsDateTime!
  version: Int!
}

enum CsDecision {
  APPROVE
  REJECT
}

enum CsMoneyOperationStatus {
  PENDING
  COMPLETED
  FAILED
}

"A BOB call made on a person's behalf or under a standing authority (money_operations)."
type CsMoneyOperation {
  idempotencyKey: ID!
  kind: String!
  status: CsMoneyOperationStatus!
  bobOperationRef: ID
}

type CsJobDecisionResult {
  job: CsJob!
  approval: CsApproval!
  "Job pay under the Guardian's session, when approved."
  payment: CsMoneyOperation
}

# ---------------------------------------------------------------- unsplit and allocation

type CsUnsplitEntry {
  entryId: ID!
  jobId: ID
  amount: CsMoney!
  createdAt: CsDateTime!
}

"Unsplit job pay, credited only by completed job pay."
type CsUnsplit {
  childCustomerId: ID!
  balance: CsMoney!
  entries: [CsUnsplitEntry!]!
  version: Int!
}

input CsSplitLegInput {
  jar: CsJar!
  amount: CsMoneyInput!
}

type CsSplitResult {
  unsplit: CsUnsplit!
  operations: [CsMoneyOperation!]!
}

# ---------------------------------------------------------------- giving (Decision 2, ID-4, D12, SD-6)

type CsCharityPreference {
  childCustomerId: ID!
  "The BOB charity id only; routing comes from Odyssey via BOB (SD-6)."
  bobCharityId: ID!
  version: Int!
}

type CsHeldGiveReview {
  childCustomerId: ID!
  amount: CsMoney!
  recipientName: String
  "True when routing is unresolved (give_unresolved) and the money stays held."
  recipientUnavailable: Boolean!
  reviewVersion: Int!
  confirmedAt: CsDateTime
}

type CsDonation {
  bobOperationRef: ID!
  amount: CsMoney!
  recipientName: String
  at: CsDateTime!
}

type CsGiving {
  preference: CsCharityPreference
  heldGiving: CsHeldGiveReview
  donations: [CsDonation!]!
}

type CsHeldReleaseResult {
  review: CsHeldGiveReview!
  operation: CsMoneyOperation
}

# ---------------------------------------------------------------- goals

type CsGoal {
  goalId: ID!
  childCustomerId: ID!
  title: String!
  target: CsMoney!
  saved: CsMoney
  imageRef: String
}

# ---------------------------------------------------------------- capabilities and teen mode (revised SD-3, SD-4)

enum CsCapabilityName {
  TEEN_MODE_CARD
}

enum CsGrantStatus {
  EARNED_WAITING
  ISSUE_FAILED
  GRANTED
}

type CsUnlockGrant {
  grantId: ID!
  childCustomerId: ID!
  capability: CsCapabilityName!
  ruleVersion: Int!
  status: CsGrantStatus!
  "BOB's card reference. Never a card number."
  bobCardRef: ID
}

type CsCapability {
  capability: CsCapabilityName!
  eligible: Boolean!
  grant: CsUnlockGrant
}

enum CsCardStatus {
  ACTIVE
  FROZEN
  CANCELLED
}

"Read from BOB. Masked only; the server never stores card numbers."
type CsCard {
  childCustomerId: ID!
  bobCardRef: ID!
  maskedNumber: String!
  status: CsCardStatus!
  "The child's one weekly limit (SD-10)."
  weeklyLimit: CsMoney!
  remainingThisWeek: CsMoney!
  "Monday 00:00 Australia/Sydney (SD-8)."
  weekResetsAt: CsDateTime!
}

# ---------------------------------------------------------------- purchases (CS-3988, SD-4, SD-10)

type CsDemoMerchant {
  merchantId: ID!
  name: String!
  category: String!
}

enum CsPurchaseOutcome {
  APPROVED
  DECLINED
}

enum CsPurchaseRoute {
  CARD
  SPEND
}

type CsPurchaseResult {
  outcome: CsPurchaseOutcome!
  route: CsPurchaseRoute!
  "BOB's reason code, passed through."
  reasonCode: String
  "BOB's plain reason, e.g. weekly limit reached (SD-10)."
  reason: String
  bobOperationRef: ID
}

# ---------------------------------------------------------------- boost (SD-1, slice S1)

type CsBoostRule {
  childCustomerId: ID!
  percent: Int!
  version: Int!
}

# ---------------------------------------------------------------- configuration and change feed

"Published tenant theme from the configuration store (CS-3909)."
type CsPublishedTheme {
  tenantId: ID!
  version: Int!
  publishedAt: CsDateTime!
  "Theme tokens as a JSON document string."
  tokensJson: String!
}

enum CsChangeEntity {
  FAMILY_SETUP
  ALLOWANCE
  JOB
  APPROVAL
  UNSPLIT
  GIVING
  GOAL
  CAPABILITY
  CARD
  PURCHASE
  THEME
  MISSION
}

type CsChange {
  cursor: String!
  entity: CsChangeEntity!
  entityId: ID!
  childCustomerId: ID
  version: Int
  at: CsDateTime!
}

type CsChangeFeed {
  "Pass back as since on the next poll."
  cursor: String!
  changes: [CsChange!]!
}

# ---------------------------------------------------------------- roots

type Query {
  viewer: CsViewer!
  family: CsFamily
  child(id: ID!): CsChild
  allowance(childId: ID!): CsAllowance!
  jobs(childId: ID): [CsJob!]!
  approvals: [CsApproval!]!
  unsplit(childId: ID!): CsUnsplit!
  giving(childId: ID!): CsGiving!
  goals(childId: ID!): [CsGoal!]!
  capabilities(childId: ID!): [CsCapability!]!
  card(childId: ID!): CsCard
  demoMerchants: [CsDemoMerchant!]!
  publishedTheme: CsPublishedTheme
  familySetup(setupRef: ID!): CsFamilySetup
  changes(since: String): CsChangeFeed!
}

"""
Every mutation takes an idempotency key (startFamilySetup uses setupRef, reused
on retry), and an expected version where state can go stale.
"""
type Mutation {
  startFamilySetup(setupRef: ID!, children: [CsSetupChildInput!]!): CsFamilySetup!

  "An amount change updates the Guardian's BOB standing authority; if BOB refuses, the rule is not saved (SD-7)."
  setAllowance(
    childId: ID!
    mode: CsAllowanceMode!
    amount: CsMoneyInput!
    cadence: CsCadence!
    startDate: CsDate!
    timezone: String!
    defaultSplit: CsSplitInput!
    linkedCondition: CsLinkedCondition
    expectedVersion: Int
    idempotencyKey: ID!
  ): CsAllowanceRule!

  submitJob(jobId: ID!, evidenceRef: String, expectedVersion: Int!, idempotencyKey: ID!): CsJob!

  decideJob(jobId: ID!, decision: CsDecision!, expectedVersion: Int!, idempotencyKey: ID!): CsJobDecisionResult!

  splitUnsplit(childId: ID!, legs: [CsSplitLegInput!]!, expectedVersion: Int!, idempotencyKey: ID!): CsSplitResult!

  setCharityPreference(childId: ID!, bobCharityId: ID!, expectedVersion: Int, idempotencyKey: ID!): CsCharityPreference!

  confirmHeldRelease(childId: ID!, reviewVersion: Int!, idempotencyKey: ID!): CsHeldReleaseResult!

  "S0. Approving teen mode with a weekly limit asks BOB to issue the card."
  decideUnlock(approvalId: ID!, decision: CsDecision!, weeklyLimit: CsMoneyInput, expectedVersion: Int!, idempotencyKey: ID!): CsUnlockGrant!

  "S0, child session only. Routed to BOB card authorisation if the child has an active card, otherwise Pay from Spend."
  purchase(merchantId: ID!, amount: CsMoneyInput!, idempotencyKey: ID!): CsPurchaseResult!

  "Slice S1 (SD-1). In the contract now; not built in S0."
  setSavingsBoost(childId: ID!, percent: Int!, expectedVersion: Int, idempotencyKey: ID!): CsBoostRule!
}
