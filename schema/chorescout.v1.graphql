# Chore Scout server GraphQL contract, version 1 (CS-3941).
#
# Source: Server and DSL Integration Specification, Confluence 3220570116 §6 (v7).
# Exposed to the apps only through the DSL (ID-1, CS-3935). No subscriptions:
# clients poll changes(since) (D14).
#
# Naming: every type is prefixed "Cs" so it never collides with the DSL's
# existing types (Money, Node, Account and the rest; see test/schema.test.ts).
# Root fields do not reuse the DSL's root field names.
#
# Versioning: once merged, this file only changes compatibly. A breaking change
# needs a new file, schema/chorescout.v2.graphql. CI enforces this
# (scripts/schema-compat.ts).
#
# Errors are GraphQL errors with extensions.code set to a CsErrorCode value.
# BOB declines are results (e.g. CsPurchaseResult.outcome), not errors.
#
# Ownership reminders: the server holds BOB customer numbers only, never
# contact details, card numbers or charity payment routing, and makes no money
# decision (amounts, limits, balances come from BOB).

schema {
  query: Query
  mutation: Mutation
}

"ISO-8601 timestamp with offset."
scalar CsDateTime

"ISO-8601 calendar date (YYYY-MM-DD)."
scalar CsDate

"Error codes carried in GraphQL error extensions.code (spec §6)."
enum CsErrorCode {
  UNAUTHENTICATED
  FORBIDDEN
  STALE_VERSION
  INVALID
  INSUFFICIENT_FUNDS
  NOT_ALLOWED_IN_STATE
  CHARITY_UNAVAILABLE
  UPSTREAM_UNAVAILABLE
}

"A money amount as a decimal string, as BOB and the DSL Money type carry it."
type CsMoney {
  amount: String!
  currency: String!
}

input CsMoneyInput {
  amount: String!
  currency: String!
}

enum CsJar {
  SPEND
  SAVE
  GIVE
}

# ---------------------------------------------------------------- viewer

enum CsRole {
  "BOB roles include guardian: at least one non-revoked link to a child."
  GUARDIAN
  CHILD
  TELLER
  "An adult BOB customer with no linked children yet (e.g. before family set-up). CS-3942."
  CUSTOMER
}

"BOB's status for a Guardian's link to a child: PENDING until the child's first sign-in."
enum CsLinkStatus {
  PENDING
  ACTIVE
}

type CsLinkedChild {
  customerId: ID!
  status: CsLinkStatus!
}

"Age band worked out by BOB from the date of birth (ID-9)."
enum CsAgeBand {
  CHILD
  YOUTH
  ADULT
}

"""
The signed-in person, derived only from BOB's session check (spec §3).
Nothing here is taken from client input.
"""
type CsViewer {
  customerId: ID!
  role: CsRole!
  tenantId: ID!
  ageBand: CsAgeBand
  linkedChildIds: [ID!]!
  linkedGuardianIds: [ID!]!
  "Guardian sessions: BOB's linked children with link status (CS-3942)."
  linkedChildren: [CsLinkedChild!]!
  anonymousPlayerId: ID
}

# ---------------------------------------------------------------- family and set-up

"A pointer record only; BOB's Guardian-child links are authoritative."
type CsFamily {
  familyId: ID!
  tenantId: ID!
  guardianCustomerIds: [ID!]!
  childCustomerIds: [ID!]!
}

type CsChild {
  customerId: ID!
  familyId: ID!
  ageBand: CsAgeBand
}

enum CsFamilySetupState {
  IN_PROGRESS
  PARTIAL
  COMPLETE
}

enum CsSetupSlotState {
  PENDING
  CREATED
  REFUSED
}

type CsSetupSlot {
  slot: Int!
  state: CsSetupSlotState!
  childCustomerId: ID
  "BOB's code when REFUSED (EMAIL_IN_USE, AGE_OUT_OF_RANGE, VALIDATION_ERROR; final for this setupRef). While PENDING: UPSTREAM_UNAVAILABLE, or IDEMPOTENCY_CONFLICT when a retry changed this child's details (resend the original details)."
  reason: String
}

type CsFamilySetup {
  setupRef: ID!
  "PARTIAL with resumable true: retry with the same setupRef. COMPLETE, or PARTIAL with resumable false: settled (CS-3948)."
  state: CsFamilySetupState!
  slots: [CsSetupSlot!]!
  familyId: ID
  "True while any slot is PENDING (not tried, or BOB's outcome unknown). Only Sarah's retry resumes it; there is no background completion."
  resumable: Boolean!
}

"Passed to BOB's create-linked-child under the Guardian's session. The server does not store contact details."
input CsSetupChildInput {
  firstName: String!
  dateOfBirth: CsDate!
  email: String!
}

# ---------------------------------------------------------------- allowance (revised SD-2, SD-7)

enum CsAllowanceMode {
  FREE
  LINKED
  EARNED
}

enum CsCadence {
  WEEKLY
}

type CsSplit {
  spendPercent: Int!
  savePercent: Int!
  givePercent: Int!
}

input CsSplitInput {
  spendPercent: Int!
  savePercent: Int!
  givePercent: Int!
}

"The Linked-mode chore condition, checked by the server at the cycle cut-off (the end of the product week, Monday 00:00 Australia/Sydney). A week with no chore assigned pays (D56)."
enum CsLinkedCondition {
  WEEK_CHORES_DONE
}

type CsAllowanceRule {
  childCustomerId: ID!
  mode: CsAllowanceMode!
  "Always equals the Guardian's standing authority amount in BOB (SD-7)."
  amount: CsMoney!
  cadence: CsCadence!
  startDate: CsDate!
  timezone: String!
  defaultSplit: CsSplit!
  linkedCondition: CsLinkedCondition
  version: Int!
}

enum CsCycleDecision {
  PAY
  SKIP
}

enum CsCycleStatus {
  DECIDED
  EXECUTED
  FAILED
}

type CsSplitLeg {
  jar: CsJar!
  amount: CsMoney!
}

type CsAllowanceReceipt {
  bobOperationRef: ID!
  amount: CsMoney!
  legs: [CsSplitLeg!]!
}

type CsAllowanceCycle {
  cycleKey: ID!
  periodStart: CsDate!
  decision: CsCycleDecision!
  reason: String
  ruleVersion: Int!
  amount: CsMoney
  bobOperationRef: ID
  status: CsCycleStatus!
  receipt: CsAllowanceReceipt
}

type CsAllowance {
  rule: CsAllowanceRule
  nextDueDate: CsDate
  lastCycle: CsAllowanceCycle
}

# ---------------------------------------------------------------- jobs and approvals

enum CsJobKind {
  HOME_JOB
  EXTRA_EARNER
  GOOD_DEED
  NEIGHBOURHOOD
}

"""
Job states (CS-3949): TODO -> WAITING -> SENT_BACK (resubmittable) or, on
approval, APPROVED_PAYMENT_PENDING -> PAID or PAYMENT_FAILED for a job with a
reward, or DONE for a good deed or a chore with no reward (no BOB call).
"""
enum CsJobStatus {
  OPEN @deprecated(reason: "Never returned. Use TODO (CS-3949).")
  SUBMITTED @deprecated(reason: "Never returned. Use WAITING (CS-3949).")
  APPROVED @deprecated(reason: "Never returned. Use APPROVED_PAYMENT_PENDING, PAID or DONE (CS-3949).")
  REJECTED @deprecated(reason: "Never returned. Use SENT_BACK (CS-3949).")
  TODO
  WAITING
  SENT_BACK
  "Approved; BOB job pay recorded but not yet reported complete. PAID only after BOB completes."
  APPROVED_PAYMENT_PENDING
  PAID
  "BOB refused the payment (reason on payment). No money moved."
  PAYMENT_FAILED
  "Approved with nothing to pay (good deed: points only; chore with no reward)."
  DONE
}

type CsJob {
  jobId: ID!
  childCustomerId: ID!
  kind: CsJobKind!
  title: String!
  reward: CsMoney
  status: CsJobStatus!
  "Reference to the child's evidence photo, if any."
  evidenceRef: String
  version: Int!
  "Good deeds carry points only (CS-3949)."
  points: Int
  createdAt: CsDateTime
  "The job's one BOB payment, once approved (CS-3949)."
  payment: CsMoneyOperation
}

enum CsApprovalKind {
  JOB
  UNLOCK
}

enum CsApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}

type CsApproval {
  approvalId: ID!
  kind: CsApprovalKind!
  status: CsApprovalStatus!
  childCustomerId: ID!
  "jobId for JOB approvals, grantId for UNLOCK approvals."
  subjectId: ID!
  createdAt: CsDateTime!
  version: Int!
}

enum CsDecision {
  APPROVE
  REJECT
}

enum CsMoneyOperationStatus {
  PENDING
  COMPLETED
  FAILED
}

"A BOB call made on a person's behalf or under a standing authority (money_operations)."
type CsMoneyOperation {
  idempotencyKey: ID!
  kind: String!
  status: CsMoneyOperationStatus!
  bobOperationRef: ID
  amount: CsMoney
  "BOB's code when FAILED (e.g. INSUFFICIENT_FUNDS, FORBIDDEN), or why it is still PENDING (e.g. UPSTREAM_UNAVAILABLE)."
  reason: String
}

type CsJobDecisionResult {
  job: CsJob!
  approval: CsApproval!
  "Job pay under the Guardian's session, when approved."
  payment: CsMoneyOperation
}

# ---------------------------------------------------------------- unsplit and allocation

type CsUnsplitEntry {
  entryId: ID!
  jobId: ID
  amount: CsMoney!
  createdAt: CsDateTime!
}

"Unsplit job pay, credited only by completed job pay."
type CsUnsplit {
  childCustomerId: ID!
  balance: CsMoney!
  entries: [CsUnsplitEntry!]!
  version: Int!
}

input CsSplitLegInput {
  jar: CsJar!
  amount: CsMoneyInput!
}

enum CsGiveOutcomeStatus {
  "The Give share went at once to the child's confirmed recipient (bob-family/1 §6.2)."
  DONATED
  "No eligible confirmed recipient: the Give share stays in Give, held (HOLD-1)."
  HELD
  "No Give share (zero Give makes no donation)."
  NONE
}

type CsGiveOutcome {
  status: CsGiveOutcomeStatus!
  amount: CsMoney!
  donationRef: ID
}

type CsSplitResult {
  unsplit: CsUnsplit!
  operations: [CsMoneyOperation!]!
  "Set once BOB has completed the split (CS-3953)."
  giveOutcome: CsGiveOutcome
}

# ---------------------------------------------------------------- giving (Decision 2, ID-4, D12, SD-6)

"""
Whether the child's future Give credits go straight to their charity (D51):
only to a charity the child chose and BOB recorded as confirmed and eligible.
Otherwise BOB holds them.
"""
enum CsCharityAvailability {
  "The child hasn't chosen a charity yet: Give credits are held."
  NONE_SELECTED
  "The chosen charity isn't eligible now (disabled or unresolved): Give credits are held, with no silent replacement."
  UNAVAILABLE
  "BOB has the child's confirmed, eligible charity: Give credits are donated at once."
  AVAILABLE
}

type CsCharityPreference {
  childCustomerId: ID!
  "The BOB charity id only; routing comes from Odyssey via BOB (SD-6)."
  bobCharityId: ID!
  version: Int!
  "BOB's revision of the charity when the child confirmed it (bob-family/1 §6.3)."
  revision: Int
  confirmedAt: CsDateTime
  availability: CsCharityAvailability!
}

type CsHeldGiveReview {
  childCustomerId: ID!
  amount: CsMoney!
  recipientName: String
  "True when routing is unresolved (give_unresolved) and the money stays held."
  recipientUnavailable: Boolean!
  reviewVersion: Int!
  confirmedAt: CsDateTime
}

type CsDonation {
  bobOperationRef: ID!
  amount: CsMoney!
  recipientName: String
  at: CsDateTime!
}

type CsGiving {
  "NONE_SELECTED when preference is null."
  availability: CsCharityAvailability!
  preference: CsCharityPreference
  """
  A choice the child made that BOB hasn't confirmed yet (its answer was lost).
  Until it settles, BOB may sweep Give to this charity or to the one in
  preference. Null when nothing is being confirmed.
  """
  confirmingBobCharityId: ID
  heldGiving: CsHeldGiveReview
  donations: [CsDonation!]!
}

type CsHeldReleaseResult {
  review: CsHeldGiveReview!
  operation: CsMoneyOperation
}

# ---------------------------------------------------------------- goals

type CsGoal {
  goalId: ID!
  childCustomerId: ID!
  title: String!
  target: CsMoney!
  saved: CsMoney
  imageRef: String
}

# ---------------------------------------------------------------- capabilities and teen mode (revised SD-3, SD-4)

enum CsCapabilityName {
  TEEN_MODE_CARD
}

enum CsGrantStatus {
  EARNED_WAITING
  ISSUE_FAILED
  GRANTED
}

type CsUnlockGrant {
  grantId: ID!
  childCustomerId: ID!
  capability: CsCapabilityName!
  ruleVersion: Int!
  status: CsGrantStatus!
  "BOB's card reference. Never a card number."
  bobCardRef: ID
}

type CsCapability {
  capability: CsCapabilityName!
  eligible: Boolean!
  grant: CsUnlockGrant
}

enum CsCardStatus {
  ACTIVE
  FROZEN
  CANCELLED
}

"Read from BOB. Masked only; the server never stores card numbers."
type CsCard {
  childCustomerId: ID!
  bobCardRef: ID!
  maskedNumber: String!
  status: CsCardStatus!
  "The child's one weekly limit (SD-10)."
  weeklyLimit: CsMoney!
  remainingThisWeek: CsMoney!
  "Monday 00:00 Australia/Sydney (SD-8)."
  weekResetsAt: CsDateTime!
}

# ---------------------------------------------------------------- purchases (CS-3988, SD-4, SD-10)

type CsDemoMerchant {
  merchantId: ID!
  name: String!
  category: String!
}

enum CsPurchaseOutcome {
  APPROVED
  DECLINED
}

enum CsPurchaseRoute {
  CARD
  SPEND
}

type CsPurchaseResult {
  outcome: CsPurchaseOutcome!
  route: CsPurchaseRoute!
  "BOB's reason code, passed through."
  reasonCode: String
  "BOB's plain reason, e.g. weekly limit reached (SD-10)."
  reason: String
  bobOperationRef: ID
}

# ---------------------------------------------------------------- boost (SD-1, slice S1)

type CsBoostRule {
  childCustomerId: ID!
  percent: Int!
  version: Int!
}

# ---------------------------------------------------------------- configuration and change feed

"Published tenant theme from the configuration store (CS-3909)."
type CsPublishedTheme {
  tenantId: ID!
  version: Int!
  publishedAt: CsDateTime!
  "Theme tokens as a JSON document string."
  tokensJson: String!
}

enum CsChangeEntity {
  FAMILY_SETUP
  ALLOWANCE
  JOB
  APPROVAL
  UNSPLIT
  GIVING
  GOAL
  CAPABILITY
  CARD
  PURCHASE
  THEME
  MISSION
}

type CsChange {
  cursor: String!
  entity: CsChangeEntity!
  entityId: ID!
  childCustomerId: ID
  version: Int
  at: CsDateTime!
}

type CsChangeFeed {
  "Pass back as since on the next poll."
  cursor: String!
  changes: [CsChange!]!
}

# ---------------------------------------------------------------- roots

type Query {
  viewer: CsViewer!
  family: CsFamily
  child(id: ID!): CsChild
  allowance(childId: ID!): CsAllowance!
  jobs(childId: ID): [CsJob!]!
  approvals: [CsApproval!]!
  unsplit(childId: ID!): CsUnsplit!
  giving(childId: ID!): CsGiving!
  goals(childId: ID!): [CsGoal!]!
  capabilities(childId: ID!): [CsCapability!]!
  card(childId: ID!): CsCard
  demoMerchants: [CsDemoMerchant!]!
  publishedTheme: CsPublishedTheme
  familySetup(setupRef: ID!): CsFamilySetup
  changes(since: String): CsChangeFeed!
}

"""
Every mutation takes an idempotency key (startFamilySetup uses setupRef, reused
on retry), and an expected version where state can go stale.
"""
type Mutation {
  startFamilySetup(setupRef: ID!, children: [CsSetupChildInput!]!): CsFamilySetup!

  "An amount change updates the Guardian's BOB standing authority; if BOB refuses, the rule is not saved (SD-7)."
  setAllowance(
    childId: ID!
    mode: CsAllowanceMode!
    amount: CsMoneyInput!
    cadence: CsCadence!
    "Must be a Monday: every allowance week runs Monday 00:00 to Monday 00:00 Australia/Sydney (D55). Anything else is INVALID."
    startDate: CsDate!
    "Must be Australia/Sydney (D55). Anything else is INVALID."
    timezone: String!
    defaultSplit: CsSplitInput!
    linkedCondition: CsLinkedCondition
    expectedVersion: Int
    idempotencyKey: ID!
    "The Guardian's own funding account for the standing authority (bob-family/1 §7.1). Required on first set-up; omit to keep it."
    fromAccountId: ID
  ): CsAllowanceRule!

  "Guardian only, for a linked child (CS-3949). A good deed carries points only; other kinds carry a reward (a HOME_JOB chore may have none)."
  createJob(childId: ID!, kind: CsJobKind!, title: String!, reward: CsMoneyInput, points: Int, idempotencyKey: ID!): CsJob!

  submitJob(jobId: ID!, evidenceRef: String, expectedVersion: Int!, idempotencyKey: ID!): CsJob!

  """
  Guardian only. APPROVE on a job with a reward needs fromAccountId, the
  Guardian's own BOB account; BOB checks it is hers (bob-family/1 §5). Job pay
  runs under the Guardian's session and arrives unsplit.
  """
  decideJob(jobId: ID!, decision: CsDecision!, expectedVersion: Int!, idempotencyKey: ID!, fromAccountId: ID): CsJobDecisionResult!

  "Guardian only. Re-sends a payment whose outcome is unknown, with its original BOB key, amount and account (CS-3949)."
  retryJobPayment(jobId: ID!, expectedVersion: Int!, idempotencyKey: ID!): CsJobDecisionResult!

  """
  Child session only, for the child's own unsplit job pay (CS-3953). Each jar
  at most once, exact cents, adding up to the whole unsplit balance at
  expectedVersion. Runs under the child's session; BOB stamps origin child.
  """
  splitUnsplit(childId: ID!, legs: [CsSplitLegInput!]!, expectedVersion: Int!, idempotencyKey: ID!): CsSplitResult!

  """
  Child session only (CS-3962, D51). Records the child's own choice and confirms
  it in BOB under the child's session (bob-family/1 §6.3). Moves no money and
  never releases held Give (HOLD-2). expectedVersion is required once a
  preference exists. A charity that isn't eligible gives CHARITY_UNAVAILABLE,
  and the earlier choice stays.
  """
  setCharityPreference(childId: ID!, bobCharityId: ID!, expectedVersion: Int, idempotencyKey: ID!): CsCharityPreference!

  confirmHeldRelease(childId: ID!, reviewVersion: Int!, idempotencyKey: ID!): CsHeldReleaseResult!

  "S0. Approving teen mode with a weekly limit asks BOB to issue the card."
  decideUnlock(approvalId: ID!, decision: CsDecision!, weeklyLimit: CsMoneyInput, expectedVersion: Int!, idempotencyKey: ID!): CsUnlockGrant!

  "S0, child session only. Routed to BOB card authorisation if the child has an active card, otherwise Pay from Spend."
  purchase(merchantId: ID!, amount: CsMoneyInput!, idempotencyKey: ID!): CsPurchaseResult!

  "Slice S1 (SD-1). In the contract now; not built in S0."
  setSavingsBoost(childId: ID!, percent: Int!, expectedVersion: Int, idempotencyKey: ID!): CsBoostRule!
}
