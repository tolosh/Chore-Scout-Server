name: deploy

# CS-3992. Manual, digest-pinned deploy of chore-scout-server to the dev
# cluster moroku-dsl-dev (service chore-scout-api; D48 as amended: public
# subnets with a public IP, only chore-scout-server-sg, no hostname or LB).
# Run it from Actions -> deploy -> Run workflow on main. It never runs on push.
#
# The verify job reruns the CI checks on the exact commit. The deploy job needs
# it, runs only on refs/heads/main, and runs only when the repo variable
# AWS_DEPLOY_ROLE_ARN is set; until then it is skipped and nothing is pushed.
# AWS access is a short-lived OIDC session for chore-scout-server-github-deploy
# (infra/iam/). No long-lived keys or secrets are referenced here. Only the
# deploy job can mint an OIDC token; verify (npm ci, tests) cannot.
#
# bootstrap (default false): allow a first run before the service exists. It
# is accepted only when the service is MISSING; it pushes the image and
# registers the task definitions, and deploys and migrates nothing.
#
# target (default api): api runs scripts/deploy.sh (build, push, migrate, API).
# jobs-bank_bilgola / jobs-bank_manly run scripts/deploy-jobs.sh for that one
# bank's allowance jobs service (CS-3979): no build (the API deploy of the same
# SHA must have pushed the image and migrated), task definition only, and the
# desired count is never set, so a stopped jobs service stays stopped. Starting
# jobs is an activation step in the runbook, not a deploy.
#
# jobs_running_ack (default false): only for a jobs target whose service is
# already running (desired > 0, after activation). Without it that deploy is refused.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy: api, or one bank''s jobs service (task definition only; desired count untouched)'
        type: choice
        required: true
        default: api
        options:
          - api
          - jobs-bank_bilgola
          - jobs-bank_manly
      bootstrap:
        description: 'First run only: the service does not exist yet; register task definitions, deploy nothing'
        type: boolean
        required: false
        default: false
      jobs_running_ack:
        description: 'Jobs targets only: the jobs service is running (desired > 0) and replacing its task definition is an approved release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-chore-scout-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test (in-memory MongoDB; binary from fastdl.mongodb.org)
        run: npm test
      - name: Schema-compatibility check against the previous commit
        run: npx tsx scripts/schema-compat.ts --base HEAD~1

  deploy:
    needs: verify
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: chore-scout-deploy-${{ github.run_id }}
          aws-region: ap-southeast-2
      - name: Build, push, migrate and deploy the API (digest-pinned)
        if: ${{ inputs.target == 'api' }}
        env:
          DEPLOY_BOOTSTRAP: ${{ inputs.bootstrap && '1' || '0' }}
        run: bash scripts/deploy.sh "$GITHUB_SHA"
      - name: Point one bank's jobs service at this digest (desired count untouched)
        if: ${{ startsWith(inputs.target, 'jobs-') }}
        env:
          DEPLOY_BOOTSTRAP: ${{ inputs.bootstrap && '1' || '0' }}
          JOBS_RUNNING_ACK: ${{ inputs.jobs_running_ack && '1' || '0' }}
          TARGET: ${{ inputs.target }}
        run: bash scripts/deploy-jobs.sh "$GITHUB_SHA" "${TARGET#jobs-}"
