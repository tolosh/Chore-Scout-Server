name: ci

# CS-3941. Runs on every PR and on main. Builds and tests; builds an image
# tagged with the commit SHA. CI pushes and deploys nothing and references no
# cloud credentials. Pushing and deploying are the manual deploy workflow's job
# (.github/workflows/deploy.yml, CS-3992).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# The candidate is the PR head commit, not GitHub's synthetic merge commit, so
# the image tag and /health report a SHA that exists on the branch.
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test (in-memory MongoDB; binary from fastdl.mongodb.org)
        run: npm test
      - name: Schema-compatibility check against the base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          npx tsx scripts/schema-compat.ts --base "$BASE"

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  image:
    needs: [verify, secrets-scan]
    runs-on: ubuntu-24.04
    env:
      IMAGE: chore-scout-server:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Build image tagged with the commit SHA (no mutable tags)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          docker build --platform linux/amd64 --build-arg GIT_SHA="${CANDIDATE_SHA}" -t "$IMAGE" .
          if docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^chore-scout-server:' | grep -v ":${CANDIDATE_SHA}$"; then
            echo "unexpected non-SHA tag" >&2; exit 1
          fi
          echo "image=$IMAGE"
          echo "image id (config digest): $(docker image inspect --format '{{.Id}}' "$IMAGE")"
          echo "revision label: $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")"
      - name: Boot without secrets fails closed (exit 78)
        run: |
          set +e
          docker run --rm "$IMAGE"; code=$?
          set -e
          echo "exit=$code"; test "$code" -eq 78
      - name: Smoke - /health reports the commit SHA
        run: |
          set -euo pipefail
          docker network create cs
          docker run -d --name mongo --network cs mongo:7.0
          docker run -d --name cs --network cs -p 3000:3000 \
            -e MONGODB_URI=mongodb://mongo:27017 -e MONGODB_DB=chorescout "$IMAGE"
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:3000/health); then break; fi; sleep 2
          done
          echo "health: $body"
          test "$(echo "$body" | jq -r .sha)" = "${CANDIDATE_SHA}"
          curl -fsS http://127.0.0.1:3000/ready
          docker logs cs | tail -20
      - name: Smoke - container health check passes, then fails with the database stopped
        run: |
          set -euo pipefail
          docker exec cs test -s /app/certs/rds-global-bundle.pem
          docker exec cs node dist/healthcheck.js
          echo "health check with database up: exit 0"
          docker stop mongo
          set +e
          docker exec cs node dist/healthcheck.js; code=$?
          set -e
          echo "health check with database stopped: exit $code"
          test "$code" -ne 0
      - name: Save image archive
        run: docker save "$IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: chore-scout-server-${{ env.CANDIDATE_SHA }}
          path: image.tar.gz
          retention-days: 7
